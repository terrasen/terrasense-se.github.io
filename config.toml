base_url = "https://terrasense.se"
title = "Terra Sense Stöd & Behandling"
description = "Öppenvård som kompletterar socialtjänsten. Hemutredningar enligt BBiC, intensiv familjebehandling i hemmiljö och handledning till familjehem, med barnets behov i centrum. Stockholm, sedan 2014."
default_language = "sv"

compile_sass = false
build_search_index = false

# Atom feed of the Reflektioner posts (the only dated pages), kept at the
# address the Jekyll site used.
generate_feeds = true
feed_filenames = ["feed.xml"]

# Logo and illustration masters stay in the repo but are not published.
ignored_static = ["assets/images/source/**", "*.DS_Store"]
ignored_content = ["*.DS_Store"]

[markdown]
# Curly quotes, dashes and ellipses, as kramdown produced.
smart_punctuation = true

# Facts used across the site, in templates and Markdown alike: {{ config.extra.phone }}
[extra]
email = "info@terrasense.se"
phone = "076-215 99 19"
org_number = "559047-6130"
invoice_address = "Flygarvägen 29, 175 69 Järfälla"
manager = "Annahita Holmberg"
meta_image = "/assets/images/og-image.png"

# Stands in for page front matter on 404.html, which has no page.
[extra.not_found]
title = "Sidan finns inte"
description = "Sidan du letar efter finns inte."
path = "/404.html"
extra = {}
